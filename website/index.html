<!DOCTYPE html>
<HTML lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Thumb-Busters</title>
        <link rel="stylesheet" href="css/site.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <script src="js/site.js"></script>
    </head>
   <body>

<header class="header">

    <nav class="navbar" aria-label="Primary Navigation">

        <button class="icon" onclick="toggleResponsiveNavigation()" aria-label="Open Navigation Menu" aria-expanded="false">
            <i class="fa fa-bars" aria-hidden="true"></i>
        </button>

        <ul class="nav-links left-links">
            <li><a href="#">Games</a></li>
            <li><a href="#">Consoles</a></li>
            <li><a href="#">Accessories</a></li>
        </ul>

        <div id="logo">
            <a href="index.html"  aria-label="Go to Home Page">
                <img src="img/ThumbBustersLogo.png" alt="Thumb-Busters">
            </a>
        </div>

        <ul class="nav-links right-links">
            <li><a href="#">Gifts & Gadgets</a></li>
            <li><a href="#" class="sales-link">Sales</a></li>
        </ul>

        <div class="nav-utilities">
             <button aria-label="Search">
                <i class="fa fa-search"></i>
            </button>

            <button aria-label="Account">
                <i class="fa fa-user"></i>
            </button>

            <button aria-label="Shopping Basket">
                <i class="fa fa-shopping-cart"></i>
            </button>
        </div>

    </nav>

</header>

<main>
<!-- HERO -->

<section class="hero">

    <img src="img/HeroBanner.png" alt="Retro Mega Sale" loading="eager" usemap="#heroMap">
    
    <map name="heroMap">
        <area
            coords="510,861,958,861,981,896,958,931,510,931,487,896"
            href="#"
            alt="Shop Sale"
            shape="poly">
    </map>

</section>


<!-- BRANDS -->

<section class="brands">

    <h2>Shop By Brand</h2>

    <div class="brand-grid">

        <div class="brand">
            <a href="#"><img src="img/playstation.png" alt="PlayStation"></a>
        </div>

        <div class="brand">
            <a href="#"><img src="img/xbox.png" alt="Xbox"></a> 
        </div>

        <div class="brand">
            <a href="#"><img src="img/nintendo.png" alt="Nintendo"></a>
        </div>

        <div class="brand">
            <a href="#"><img src="img/sega.png" alt="Sega"></a>
        </div>

        <div class="brand">
            <a href="#"><img src="img/atari.png" alt="Atari"></a>
        </div>

    </div>

</section>


<!-- TRENDING -->

<section class="trending">

    <img src="img/trending-banner.png" alt="Top Trending" loading="lazy">
    <div class="trending-box">

        <div class="box-header">
            Top Trending
        </div>

        <div class="box-content">
            <p>Checkout the top trending products</p>

            <a href="#" class="shop-button">
                Shop Now
            </a>

        </div>

    </div>
</section>

</main>


<footer class="footer">

    <div class="footer-copyright">
        <p>&copy; Thumb-Busters 2026</p>
    </div>

    <div class="footer-column">
        <a href="#">About Us</a>
        <a href="#">Contact Us</a>
        <a href="#">FAQs</a>
    </div>

    <div class="footer-column">
        <a href="#">Stores</a>
        <a href="#">Returns</a>
        <a href="#">Deliveries</a>
    </div>

    <div class="footer-column">
        <a href="#">Terms and Conditions</a>
        <a href="#">Privacy Policy</a>
    </div>

    <div class="footer-social">
        <p>Follow Us On</p>

        <div class="social-icons">
            <a href="#" aria-label="Visit our Facebook page"><i class="fab fa-facebook"></i></a>
            <a href="#" aria-label="Visit our X page"><i class="fab fa-x-twitter"></i></a>
            <a href="#" aria-label="Visit our Instagram page"><i class="fab fa-instagram"></i></a>
        </div>
    </div>

</footer>
</body>
</HTML>
